# Forgejo-canonical CI gate for the tap audit surface.
#
# `ward exec audit` remains the canonical local command, but the pinned
# agentic-os/dev-base image used by this repo does not ship Homebrew today, so
# CI falls back to the smallest useful static guard: Ruby syntax checks for
# every Formula file. Follow-up: swap this job back to `ward exec audit` once
# the image grows brew.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  formula-syntax:
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:v0.255.0
    steps:
      - uses: actions/checkout@v4

      - name: Install Ruby
        run: |
          set -euo pipefail
          if command -v ruby >/dev/null 2>&1; then
            exit 0
          fi
          apt-get update -qq
          apt-get install -y -qq ruby

      - name: Syntax-check Formula files
        run: |
          set -euo pipefail
          for formula in Formula/*.rb; do
            ruby -c "$formula"
          done
      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE: https://api.telegram.org
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          def build_message(repo, workflow, job, ref, sha, run_url):
              return "\n".join([
                  "CI failed on main",
                  f"repo: {repo}",
                  f"workflow: {workflow}",
                  f"job: {job}",
                  f"ref: {ref}",
                  f"sha: {sha}",
                  f"run: {run_url}",
              ])

          def main():
              bot_token = os.environ["BOT_TOKEN"]
              chat_id = os.environ["CHAT_ID"]
              message = build_message(
                  os.environ["REPO"],
                  os.environ["WORKFLOW"],
                  os.environ["JOB"],
                  os.environ["REF"],
                  os.environ["SHA"],
                  os.environ["RUN_URL"],
              )
              payload = urllib.parse.urlencode(
                  {
                      "chat_id": chat_id,
                      "text": message,
                      "disable_web_page_preview": "true",
                  }
              ).encode("utf-8")
              url = f"{os.environ['API_BASE'].rstrip('/')}/bot{bot_token}/sendMessage"
              req = urllib.request.Request(url, data=payload, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      resp.read()
              except urllib.error.URLError as exc:
                  print(f"telegram alert failed: {exc}")
                  raise SystemExit(1)

          main()
          PY
